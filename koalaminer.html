
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KoalaMiner</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#101713;color:#f2f7f2;
  font-family:Arial,sans-serif;padding:20px;
}
.app{max-width:440px;margin:auto}
header{text-align:center;padding:16px 0 22px}
.logo{font-size:60px}
h1{margin:8px 0;color:#a7f36a;font-size:28px}
.sub{color:#a5b4a8;font-size:14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{
  background:#1b2720;border:1px solid #304536;
  border-radius:18px;padding:16px;
}
.label{font-size:12px;color:#a5b4a8}
.value{font-size:24px;font-weight:bold;margin-top:9px}
.mine{text-align:center;margin:18px 0}
.koala{
  width:190px;height:190px;border-radius:50%;
  border:3px solid #8ed957;background:#263c2b;
  font-size:100px;cursor:pointer;
  box-shadow:0 0 35px #6fbd4930;
}
.hint{color:#a5b4a8;font-size:13px;margin-top:12px}
.section-title{font-size:16px;margin:24px 0 12px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{
  background:#1b2720;border:1px solid #304536;
  border-radius:14px;padding:15px 10px;
  color:#f2f7f2;text-align:center;font-size:14px;
}
.item span{display:block;font-size:24px;margin-bottom:8px}
footer{text-align:center;color:#7e9182;font-size:12px;margin:24px 0 10px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">🐨</div>
    <h1>KoalaMiner</h1>
    <div class="sub">Tap, collect and climb the leaderboard</div>
  </header>

  <div class="stats">
    <div class="card">
      <div class="label">YOUR POINTS</div>
      <div class="value" id="points">0</div>
    </div>
    <div class="card">
      <div class="label">ENERGY</div>
      <div class="value" id="energy">100/100</div>
    </div>
  </div>

  <div class="mine">
    <button class="koala" id="mine" aria-label="Mine points">🐨</button>
    <div class="hint">Tap the koala to mine points!</div>
  </div>

  <div class="section-title">Your game</div>
  <div class="menu">
    <div class="item"><span>👤</span>Profile</div>
    <div class="item"><span>🏆</span>Leaderboard</div>
    <div class="item"><span>🎁</span>Missions</div>
    <div class="item"><span>⚡</span>Boost</div>
    <div class="item"><span>💼</span>Wallet</div>
    <div class="item"><span>📊</span>Statistics</div>
  </div>

  <footer>KoalaMiner · Demo interface</footer>
</div>

<script>
let points = 0;
let energy = 100;

document.getElementById("mine").addEventListener("click", () => {
  if (energy < 1) {
    alert("No energy left!");
    return;
  }
  points += 1;
  energy -= 1;
  document.getElementById("points").textContent = points;
  document.getElementById("energy").textContent = energy + "/100";
});
</script>
</body>
</html>
